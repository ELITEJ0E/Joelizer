name: Verify Video Export

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/video-export-timeline-freeze-20261103]
  workflow_dispatch:

concurrency:
  group: verify-video-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # The existing package-lock.json is stale; install from package.json for this verification run.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run lint
      - run: npx tsx src/tests/audioMasteringLab.test.ts
      - run: npx tsx src/tests/phonkSynthEngine.test.ts
      - run: npx tsx src/tests/musicStudioArchive.test.ts
      - run: npx tsx src/tests/dawProWorkflow.test.ts
      - run: npx tsx src/tests/browserExportClock.test.ts
      - run: npx tsx src/tests/videoPlaybackSync.test.ts
      - run: npx tsx src/tests/export1080pStress.test.ts
      - run: npx tsx src/tests/mvCaptionLayout.test.ts
      - run: npx tsx src/tests/offlineAudioAnalysis.test.ts
      - run: npm run build
      - name: Install Google Chrome for responsive MV UI checks
        run: npx playwright install --with-deps chrome
      - name: Verify Audio Lab browser mastering and WAV export
        run: npx tsx src/tests/audioMasteringLab.browser.test.ts
      - name: Verify dedicated Music Studio browser, sample import, drums and piano roll
        run: npx tsx src/tests/musicStudio.browser.test.ts
      - name: Verify responsive preview, media dialogs and hover behavior
        run: npx tsx src/tests/mvStudioResponsive.browser.test.ts
      - name: Install FFmpeg for MP4 validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate moving video and short soundtrack fixtures
        run: |
          mkdir -p public/staged
          ffmpeg -y -v error -f lavfi -i testsrc2=size=320x180:rate=60 -t 6 -c:v libx264 -preset ultrafast -pix_fmt yuv420p public/staged/smoke-video.mp4
          ffmpeg -y -v error -f lavfi -i sine=frequency=440:sample_rate=48000 -t 10 -c:a pcm_s16le public/staged/smoke-audio.wav
      - name: Verify soundtrack-driven exported visualizer beat alignment
        run: npx tsx src/tests/visualizerAudioSync.test.ts
      - name: Render and inspect lyrics + MV exports
        run: npx tsx src/tests/videoExportSmoke.test.ts
      - name: Verify imported trimmed clips in browser WebCodecs MP4
        run: npx tsx src/tests/offlineWebCodecs.browser.test.ts

  offline-windows:
    name: Verify trimmed imported clips with WebCodecs on Windows Chrome
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chrome browser
        run: npx playwright install chrome
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Generate video with motion + audio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path public/staged | Out-Null
          ffmpeg -y -v error -f lavfi -i testsrc2=size=320x180:rate=60 -t 4 -c:v libx264 -preset ultrafast -pix_fmt yuv420p public/staged/smoke-video.mp4
          ffmpeg -y -v error -f lavfi -i sine=frequency=440:sample_rate=48000 -t 10 -c:a pcm_s16le public/staged/smoke-audio.wav
      - name: Validate trimmed source + 30/60fps browser MP4
        run: npx tsx src/tests/offlineWebCodecs.browser.test.ts
