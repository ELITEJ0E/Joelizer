name: Verify Lyrics Settings Navigation

on:
  pull_request:
    paths:
      - 'src/components/LyricsStudio/LyricsVideoLayout.tsx'
      - 'src/components/MVStudio/GlobalSettingsPanel.tsx'
      - 'src/components/shared/OverlayEffectsPanel.tsx'
      - 'src/index.css'
      - 'src/tests/lyricsSettingsNavigation.browser.test.ts'
      - '.github/workflows/verify-lyrics-settings-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/LyricsStudio/LyricsVideoLayout.tsx'
      - 'src/components/MVStudio/GlobalSettingsPanel.tsx'
      - 'src/components/shared/OverlayEffectsPanel.tsx'
      - 'src/index.css'
      - 'src/tests/lyricsSettingsNavigation.browser.test.ts'
      - '.github/workflows/verify-lyrics-settings-navigation.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Chrome
        run: npx playwright install --with-deps chrome
      - name: Verify tab navigation, hover arrows, overlay options and scrollbars
        run: npx tsx src/tests/lyricsSettingsNavigation.browser.test.ts
