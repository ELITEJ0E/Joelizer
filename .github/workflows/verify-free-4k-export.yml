name: Verify Free 4K Browser Export

on:
  pull_request:
    paths:
      - 'src/components/Editor/ExportModal.tsx'
      - 'src/lib/renderers/OfflineWebCodecsRenderer.ts'
      - 'src/tests/browserHighResolution.test.ts'
      - '.github/workflows/verify-free-4k-export.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/Editor/ExportModal.tsx'
      - 'src/lib/renderers/OfflineWebCodecsRenderer.ts'
      - 'src/tests/browserHighResolution.test.ts'
      - '.github/workflows/verify-free-4k-export.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate 1440p/4K codec levels and exact-resolution preflight
        run: npx tsx src/tests/browserHighResolution.test.ts
      - run: npm run build
