    <script>
      (function() {
        try {
          var currentFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var descriptor = {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          };
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (_) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (_) {}
          }
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') === 0 || event.filename.indexOf('moz-extension://') === 0)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
