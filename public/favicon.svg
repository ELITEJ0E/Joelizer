<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d0a"/>
      <stop offset="50%" stop-color="#020504"/>
      <stop offset="100%" stop-color="#000201"/>
    </linearGradient>

    <!-- Neon Spectrum Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Horizontal Neon Bar Gradient -->
    <linearGradient id="neonHorizontal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonHorizontal)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Subtle Radial Inner Glow -->
  <circle cx="256" cy="256" r="180" fill="#00ff87" opacity="0.06" filter="url(#strongGlow)" />

  <!-- Audio Equalizer Visualizer Spectrum Bars -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="72" y="240" width="22" height="32" rx="11" fill="url(#neonGlow)" opacity="0.75"/>
    <!-- Bar 2 -->
    <rect x="112" y="190" width="22" height="132" rx="11" fill="url(#neonGlow)"/>
    <!-- Bar 3 -->
    <rect x="152" y="140" width="22" height="232" rx="11" fill="url(#neonGlow)"/>
    <!-- Bar 4 (Peak Left) -->
    <rect x="192" y="96" width="22" height="320" rx="11" fill="url(#neonGlow)"/>
    <!-- Bar 5 (Center Left) -->
    <rect x="232" y="160" width="22" height="192" rx="11" fill="url(#neonGlow)"/>
    <!-- Bar 6 (Center Right) -->
    <rect x="272" y="120" width="22" height="272" rx="11" fill="url(#neonGlow)"/>
    <!-- Bar 7 (Peak Right) -->
    <rect x="312" y="72" width="22" height="368" rx="11" fill="url(#neonGlow)"/>
    <!-- Bar 8 -->
    <rect x="352" y="150" width="22" height="212" rx="11" fill="url(#neonGlow)"/>
    <!-- Bar 9 -->
    <rect x="392" y="210" width="22" height="92" rx="11" fill="url(#neonGlow)"/>
    <!-- Bar 10 -->
    <rect x="432" y="246" width="22" height="20" rx="10" fill="url(#neonGlow)" opacity="0.6"/>
  </g>

  <!-- Dynamic Sine Soundwave Overlay Line -->
  <path d="M 50 256 Q 112 160, 172 256 T 292 256 T 412 256 T 462 256" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" 
        opacity="0.85" 
        filter="url(#glow)" />

  <!-- Peak Indicator Floating Dots -->
  <g fill="#00e5ff" filter="url(#glow)">
    <circle cx="123" cy="166" r="6" />
    <circle cx="163" cy="116" r="6" />
    <circle cx="203" cy="72" r="7" />
    <circle cx="283" cy="96" r="6" />
    <circle cx="323" cy="48" r="8" fill="#ffffff" />
    <circle cx="363" cy="126" r="6" />
  </g>
</svg>
